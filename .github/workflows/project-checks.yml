name: Project checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-control.txt
      - run: python -m cli.check_privacy
      - run: python -m cli.check_quality
      - run: python -m cli.check_evaluation
      - run: python -m cli.check_track_review
      - run: python -m cli.check_batch
      - run: python -m cli.check_person_library
      - run: python -m cli.check_qwen
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m cli.check_match
      - run: python -m cli.check_gallery
      - run: python -m cli.check_tracklet_bootstrap
      - run: python -m cli.check_web
      - run: pip install -r requirements-teamtrack.txt
      - run: python -m cli.check_teamtrack
      - run: python -m cli.check_sportsmot
