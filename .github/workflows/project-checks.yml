name: Project checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m cli.check_privacy
      - run: python -m cli.check_quality
      - run: python -m cli.check_evaluation
