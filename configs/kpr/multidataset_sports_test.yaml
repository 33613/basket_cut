# Project-owned inference settings for the Hugging Face multi-dataset KPR model.
#
# The checkpoint contains the exact trained model.kpr / promptable transformer
# configuration.  pipeline.identity.KPRBackend always sets model.load_config
# to True, so those architecture values are restored from the checkpoint.

data:
  # KPR calls its image-ReID dataset registry before restoring the checkpoint
  # configuration.  SportsMOT is in the checkpoint's training mixture but is
  # not registered there, so use the valid Market1501 bootstrap chosen by the
  # official TrackLab wrapper.  No Market1501 images are loaded by this adapter.
  sources: ["market1501"]
  targets: ["market1501"]
  height: 256
  width: 128
  norm_mean: [0.485, 0.456, 0.406]
  norm_std: [0.229, 0.224, 0.225]

model:
  pretrained: false
  load_config: true
  kpr:
    keypoints:
      prompt_masks: keypoints_gaussian
      # This multi-dataset checkpoint's official TrackLab wrapper uses cck6.
      prompt_preprocess: cck6
    masks:
      dir: ""
      preprocess: five_v
  transreid:
    sie_camera: false

test:
  evaluate: true
  normalize_feature: true
