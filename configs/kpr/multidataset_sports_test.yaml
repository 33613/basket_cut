# Project-owned inference settings for the Hugging Face multi-dataset KPR model.
#
# The checkpoint contains the exact trained model.kpr / promptable transformer
# configuration.  pipeline.identity.KPRBackend always sets model.load_config
# to True, so those architecture values are restored from the checkpoint.

data:
  # KPR calls its dataset registry before it restores the checkpoint's
  # embedded model configuration. SportsMOT is part of this checkpoint's
  # training mixture but is not registered as an image-ReID dataset in the
  # upstream KPR repository. occ_PoseTrack21 supplies the compatible 17-keypoint
  # / eight-body-part preprocessing schema only; it does not change the loaded
  # checkpoint or run a PoseTrack dataset evaluation.
  sources: ["occ_PoseTrack21"]
  targets: ["occ_PoseTrack21"]
  height: 256
  width: 128
  norm_mean: [0.485, 0.456, 0.406]
  norm_std: [0.229, 0.224, 0.225]

model:
  pretrained: false
  load_config: true
  kpr:
    keypoints:
      prompt_masks: keypoints_gaussian
      prompt_preprocess: cck8
    masks:
      dir: pose_on_img_crops
      preprocess: eight
  transreid:
    sie_camera: false

test:
  evaluate: true
  normalize_feature: true
